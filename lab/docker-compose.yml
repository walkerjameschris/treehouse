services:

  ollama:
    image: ollama/ollama
    container_name: ollama
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ollama-network

  lab:
    build: .
    container_name: lab
    ports:
      - "8443:8443"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - UV_PROJECT_ENVIRONMENT=".venv"
      - UV_IGNORE_ENV=1
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - ollama-network

volumes:
  ollama-models: {}

networks:
  ollama-network:
    driver: bridge
